name: Release

# On-demand publishing to crates.io. Bump the crate version(s) in Cargo.toml
# first, then run this workflow from the Actions tab. Defaults to a dry run so
# you can validate packaging before actually uploading.
#
# Authentication uses crates.io Trusted Publishing (OIDC): a short-lived token
# is minted per run, so there is no long-lived CARGO_REGISTRY_TOKEN secret to
# store or leak. Before the first real publish, configure a Trusted Publisher
# for each crate on crates.io (Owner: this repo, Workflow: release.yml).
on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - dmrtd
          - mrz-parser
          - aamva
          - aadhaar-offline-kyc
          - incometax-pan-qr
      dry_run:
        description: "Dry run (package + verify only, no upload)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Dry run: packages and verifies the selected crate(s) without uploading. This
  # job deliberately holds NO id-token permission — it never authenticates to
  # crates.io, so an OIDC token must not be mintable on this path.
  dry-run:
    name: dry-run (${{ inputs.crate }})
    # Only ever run from the repository's default branch, so a manual dispatch
    # from an arbitrary branch cannot reach crates.io. Uses the default-branch
    # context so it keeps working if the branch is renamed.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions pinned to immutable commit SHAs (version in comment).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - name: Dry-run publish to crates.io
        env:
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          # Expands the crate selection: "all" -> every member crate, otherwise
          # just the chosen one. The member crates are independent (no inter-crate
          # path deps), so the order is not significant.
          selected_crates() {
            if [ "${CRATE}" = "all" ]; then
              echo "mrz-parser aamva aadhaar-offline-kyc incometax-pan-qr dmrtd"
            else
              echo "${CRATE}"
            fi
          }
          for c in $(selected_crates); do
            echo "::group::cargo publish -p ${c} --locked --dry-run"
            cargo publish -p "${c}" --locked --dry-run
            echo "::endgroup::"
          done

  # Real publish: uploads the selected crate(s) to crates.io. Only this job holds
  # id-token: write, so the short-lived OIDC token can only be minted on the real
  # publish path.
  publish:
    name: publish (${{ inputs.crate }})
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the crates.io OIDC token
    steps:
      # Third-party actions pinned to immutable commit SHAs (version in comment).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      # Mint a short-lived crates.io token via OIDC for the real publish.
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          # Expands the crate selection: "all" -> every member crate, otherwise
          # just the chosen one. The member crates are independent (no inter-crate
          # path deps), so the order is not significant.
          selected_crates() {
            if [ "${CRATE}" = "all" ]; then
              echo "mrz-parser aamva aadhaar-offline-kyc incometax-pan-qr dmrtd"
            else
              echo "${CRATE}"
            fi
          }
          for c in $(selected_crates); do
            echo "::group::cargo publish -p ${c} --locked"
            cargo publish -p "${c}" --locked
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Flutter FFI: cross-compile dmrtd for the mobile targets a Dart `dart:ffi`
  # binding loads — iOS static libs bundled as an XCFramework, Android shared
  # libs laid out per-ABI under jniLibs. Runs whenever dmrtd is in scope, on both
  # dry runs and real publishes (it produces build artifacts, not a crates.io
  # upload, so it holds no id-token and needs no branch gating).
  #
  # NB: dmrtd has no `extern "C"` surface yet, so these libraries currently expose
  # the crate compiled for each target but no C-callable API. This job proves the
  # crate cross-compiles to every mobile ABI and produces the artifacts; the C ABI
  # / uniffi layer Flutter calls through is a separate change.
  ffi-ios:
    name: flutter-ffi (iOS)
    if: ${{ inputs.crate == 'dmrtd' || inputs.crate == 'all' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + iOS targets)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build static libs (device + simulator)
        run: |
          set -euo pipefail
          # iOS FFI links a static archive, so build only the staticlib — this skips
          # the pointless cdylib (.dylib) and its dynamic-link step.
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            echo "::group::cargo rustc --target ${t} --crate-type staticlib"
            cargo rustc -p dmrtd --release --locked --target "${t}" --crate-type staticlib
            echo "::endgroup::"
          done
      - name: Assemble XCFramework
        run: |
          set -euo pipefail
          # The two simulator slices (Apple-silicon + Intel) share one platform, so
          # they must be a single fat library; the device slice stays on its own.
          lipo -create \
            target/aarch64-apple-ios-sim/release/libdmrtd.a \
            target/x86_64-apple-ios/release/libdmrtd.a \
            -output libdmrtd-sim.a
          rm -rf dmrtd.xcframework
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libdmrtd.a \
            -library libdmrtd-sim.a \
            -output dmrtd.xcframework
      - name: Upload XCFramework
        # TODO: pin to a commit SHA to match this repo's action-pinning convention.
        uses: actions/upload-artifact@v4
        with:
          name: dmrtd-ios-xcframework
          path: dmrtd.xcframework
          if-no-files-found: error

  ffi-android:
    name: flutter-ffi (Android)
    if: ${{ inputs.crate == 'dmrtd' || inputs.crate == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build shared libs (all ABIs)
        # The Android NDK is preinstalled on the runner; cargo-ndk finds it via
        # ANDROID_NDK_HOME and lays the .so files out in the jniLibs ABI folders.
        run: |
          set -euo pipefail
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ./jniLibs \
            build -p dmrtd --release --locked
      - name: Upload jniLibs
        # TODO: pin to a commit SHA to match this repo's action-pinning convention.
        uses: actions/upload-artifact@v4
        with:
          name: dmrtd-android-jnilibs
          path: jniLibs
          if-no-files-found: error
