name: Release

# On-demand publishing to crates.io. Bump the crate version(s) in Cargo.toml
# first, then run this workflow from the Actions tab. Defaults to a dry run so
# you can validate packaging before actually uploading.
#
# Authentication uses crates.io Trusted Publishing (OIDC): a short-lived token
# is minted per run, so there is no long-lived CARGO_REGISTRY_TOKEN secret to
# store or leak. Before the first real publish, configure a Trusted Publisher
# for each crate on crates.io (Owner: this repo, Workflow: release.yml).
on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - dmrtd
          - mrz-parser
          - aamva
          - aadhaar-offline-kyc
          - incometax-pan-qr
      dry_run:
        description: "Dry run (package + verify only, no upload)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Dry run: packages and verifies the selected crate(s) without uploading. This
  # job deliberately holds NO id-token permission — it never authenticates to
  # crates.io, so an OIDC token must not be mintable on this path.
  dry-run:
    name: dry-run (${{ inputs.crate }})
    # Only ever run from the repository's default branch, so a manual dispatch
    # from an arbitrary branch cannot reach crates.io. Uses the default-branch
    # context so it keeps working if the branch is renamed.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions pinned to immutable commit SHAs (version in comment).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - name: Dry-run publish to crates.io
        env:
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          # Expands the crate selection: "all" -> every member crate, otherwise
          # just the chosen one. The member crates are independent (no inter-crate
          # path deps), so the order is not significant.
          selected_crates() {
            if [ "${CRATE}" = "all" ]; then
              echo "mrz-parser aamva aadhaar-offline-kyc incometax-pan-qr dmrtd"
            else
              echo "${CRATE}"
            fi
          }
          for c in $(selected_crates); do
            echo "::group::cargo publish -p ${c} --locked --dry-run"
            cargo publish -p "${c}" --locked --dry-run
            echo "::endgroup::"
          done

  # Real publish: uploads the selected crate(s) to crates.io. Only this job holds
  # id-token: write, so the short-lived OIDC token can only be minted on the real
  # publish path.
  publish:
    name: publish (${{ inputs.crate }})
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the crates.io OIDC token
    steps:
      # Third-party actions pinned to immutable commit SHAs (version in comment).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      # Mint a short-lived crates.io token via OIDC for the real publish.
      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          # Expands the crate selection: "all" -> every member crate, otherwise
          # just the chosen one. The member crates are independent (no inter-crate
          # path deps), so the order is not significant.
          selected_crates() {
            if [ "${CRATE}" = "all" ]; then
              echo "mrz-parser aamva aadhaar-offline-kyc incometax-pan-qr dmrtd"
            else
              echo "${CRATE}"
            fi
          }
          for c in $(selected_crates); do
            echo "::group::cargo publish -p ${c} --locked"
            cargo publish -p "${c}" --locked
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Flutter FFI: cross-compile `identity-mobile` for the mobile targets a Dart
  # `dart:ffi` binding loads — iOS static libs bundled as an XCFramework, Android
  # shared libs laid out per-ABI under jniLibs.
  #
  # `identity-mobile` is the crate that belongs here: it is the one shaped for the
  # boundary, combining the passport and mDL paths behind a single result. Building
  # `dmrtd` alone produced a library with no reason to be loaded on its own.
  #
  # It is unpublished, so these jobs run on any invocation rather than being gated
  # on a crate selection. They produce build artifacts, not a crates.io upload, so
  # they hold no id-token and need no branch gating.
  #
  # The crate exports its own C ABI (crates/identity-mobile/src/ffi.rs), which the
  # Flutter plugin in crates/identity-mobile/flutter binds through dart:ffi. These
  # jobs cross-compile it to every mobile ABI and produce the artifacts that plugin
  # links against — the .so files under jniLibs, and the xcframework the Swift
  # package declares as a binary target.
  ffi-ios:
    name: flutter-ffi (iOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + iOS targets)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build static libs (device + simulator)
        run: |
          set -euo pipefail
          # iOS FFI links a static archive, so build only the staticlib — this skips
          # the pointless cdylib (.dylib) and its dynamic-link step.
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            echo "::group::cargo rustc --target ${t} --crate-type staticlib"
            cargo rustc -p identity-mobile --release --locked --target "${t}" --crate-type staticlib
            echo "::endgroup::"
          done
      - name: Assemble XCFramework
        run: |
          set -euo pipefail
          # The two simulator slices (Apple-silicon + Intel) share one platform, so
          # they must be a single fat library; the device slice stays on its own.
          lipo -create \
            target/aarch64-apple-ios-sim/release/libidentity_mobile.a \
            target/x86_64-apple-ios/release/libidentity_mobile.a \
            -output libidentity_mobile-sim.a
          rm -rf identity_mobile.xcframework
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libidentity_mobile.a \
            -library libidentity_mobile-sim.a \
            -output identity_mobile.xcframework
      # Drops beside the plugin's Package.swift, which declares it as a binary target.
      # SwiftPM, not CocoaPods: see crates/identity-mobile/flutter/identity_mobile.
      - name: Upload XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-mobile-ios-xcframework
          path: identity_mobile.xcframework
          if-no-files-found: error

  ffi-android:
    name: flutter-ffi (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build shared libs (all ABIs)
        # The Android NDK is preinstalled on the runner; cargo-ndk finds it via
        # ANDROID_NDK_HOME and lays the .so files out in the jniLibs ABI folders.
        run: |
          set -euo pipefail
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ./jniLibs \
            build -p identity-mobile --release --locked
      - name: Upload jniLibs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-mobile-android-jnilibs
          path: jniLibs
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Commit the built natives back into the plugin.
  #
  # Without this the .so files and the xcframework exist only as Actions
  # artifacts, which expire and need auth to fetch — so a consumer cannot depend
  # on this plugin by git ref and has to copy binaries in by hand. Committing
  # them makes `git:` in a pubspec work.
  #
  # The trade is deliberate: these are large and git keeps every version, so the
  # repository grows by roughly their combined size on each release. That is
  # affordable because this workflow is dispatch-only — releases are chosen, not
  # triggered by every push.
  # ---------------------------------------------------------------------------
  commit-natives:
    name: commit natives
    needs: [ffi-ios, ffi-android]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      # The only job here that writes. Everything else stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Needed to push; the other jobs deliberately drop credentials.
          persist-credentials: true

      - name: Download XCFramework
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: identity-mobile-ios-xcframework
          path: >-
            crates/identity-mobile/flutter/identity_mobile/ios/identity_mobile/identity_mobile.xcframework

      - name: Download jniLibs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: identity-mobile-android-jnilibs
          path: crates/identity-mobile/flutter/identity_mobile/android/src/main/jniLibs

      - name: Commit
        run: |
          set -euo pipefail
          plugin=crates/identity-mobile/flutter/identity_mobile
          git add \
            "$plugin/ios/identity_mobile/identity_mobile.xcframework" \
            "$plugin/android/src/main/jniLibs"

          # A rebuild of unchanged sources still produces byte-identical output
          # often enough that an empty commit is the normal case, not an error.
          if git diff --cached --quiet; then
            echo "Natives unchanged; nothing to commit."
            exit 0
          fi

          version=$(grep -m1 '^version' \
            "$plugin/pubspec.yaml" | awk '{print $2}')

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] because ci.yml runs on push to main, and rebuilding the
          # workspace to verify a binary drop it cannot inspect proves nothing.
          git commit -m "chore(identity-mobile): native artifacts for ${version} [skip ci]" \
                     -m "Built by the Release workflow from ${GITHUB_SHA}. Committed so the plugin is usable as a git dependency."
          git push
