name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to immutable commit SHAs to avoid executing
# code from mutable tags/branches. The trailing comment records the source
# ref the SHA was taken from (a tag like `v4`, or a branch like `master`) — it
# is documentation only; the SHA is what's actually used.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  # Runs on `stable` rather than a pinned version, so a toolchain bump that introduces
  # new lints fails here rather than accumulating unnoticed — which is how this became a
  # 74-diagnostic cleanup instead of a one-line fix. Anything deliberate is `#[allow]`ed
  # at the site with the reason, so a failure here means something new.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Test
        run: cargo test --workspace --verbose
      # `mdl-verify` is also built for mobile reader apps, which drop the bundled
      # reqwest CRL client. That configuration compiles different code — a caller
      # supplies the HTTP client — so it needs its own run; the default job would not
      # notice it breaking.
      - name: Test mdl-verify without the bundled HTTP client
        run: cargo test -p mdl-verify --no-default-features --verbose

  # `identity-mobile` is the crate that ships to phones, so it is the one whose mobile
  # targets are worth guarding. Checking it covers `dmrtd` and `mdl-verify` too, since
  # it depends on both — and it does so with the bundled HTTP client off, which is what
  # keeps `ring` out of the graph and the Android build free of an NDK. If that ever
  # stops being true, this job is where it shows up.
  # Android only. iOS needs a macOS runner, which bills at a multiplier, and
  # release.yml's `ffi-ios` job already cross-compiles the same crate for all three
  # iOS slices — paying for it on every pull request as well buys very little.
  android:
    name: android target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + aarch64-linux-android)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # No NDK is installed on purpose: needing one would mean something in the
      # dependency graph started compiling C.
      - name: Check
        run: cargo check -p identity-mobile --target aarch64-linux-android --verbose

  # The Dart half of `identity-mobile` is one side of a contract whose other side is
  # Rust: what the ABI emits, and what `models.dart` makes of it. Nothing here compiles
  # against the native library — the tests cover the JSON boundary, which is exactly
  # where a mismatch would otherwise surface for the first time on a device with a
  # passport held against it.
  #
  # `flutter test` rather than `dart test`: the package depends on the Flutter SDK
  # through `flutter_test`, so the plain Dart runner cannot resolve it.
  flutter:
    name: flutter (analyze & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/identity-mobile/flutter/identity_mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      # `flutter analyze` treats infos as fatal as well as warnings — both flags default
      # to true, which is where it differs from `dart analyze`. So this is the strict bar,
      # and it is the bar the package already meets: the first run of this job reported
      # "No issues found!" with nothing suppressed.
      #
      # Left that way deliberately. `--no-fatal-infos` would loosen a bar the code clears
      # today, and most of what `flutter_lints` has to say arrives at info level — which
      # is exactly the material that accumulates when nothing fails on it.
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
