name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to immutable commit SHAs to avoid executing
# code from mutable tags/branches. The trailing comment records the source
# ref the SHA was taken from (a tag like `v4`, or a branch like `master`) — it
# is documentation only; the SHA is what's actually used.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  # Runs on `stable` rather than a pinned version, so a toolchain bump that introduces
  # new lints fails here rather than accumulating unnoticed — which is how this became a
  # 74-diagnostic cleanup instead of a one-line fix. Anything deliberate is `#[allow]`ed
  # at the site with the reason, so a failure here means something new.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Test
        run: cargo test --workspace --verbose
      # `mdl-verify` is also built for mobile reader apps, which drop the bundled
      # reqwest CRL client. That configuration compiles different code — a caller
      # supplies the HTTP client — so it needs its own run; the default job would not
      # notice it breaking.
      - name: Test mdl-verify without the bundled HTTP client
        run: cargo test -p mdl-verify --no-default-features --verbose
      # Without the bundled client nothing in the graph compiles C, so the Android
      # target checks with no NDK. That is the property worth protecting: if it ever
      # needs one again, this step is where it shows up.
      - name: Check the Android target (no NDK)
        run: |
          rustup target add aarch64-linux-android
          cargo check -p mdl-verify --no-default-features --target aarch64-linux-android --verbose
      # `identity-mobile` is the artifact the phone apps actually link, so the target
      # that matters most is the one it builds for. It depends on `mdl-verify` without
      # the bundled HTTP client precisely so this needs no NDK.
      - name: Check identity-mobile for Android (no NDK)
        run: cargo check -p identity-mobile --target aarch64-linux-android --verbose
