[package]
name = "dmrtd"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "eMRTD / ICAO 9303 reader core in pure Rust — BAC, PACE (ECDH-GM P-256), MRZ, LDS parsing, secure messaging. Transport-agnostic (NFC plugs in via a Transceiver trait)."
documentation = "https://docs.rs/dmrtd"
readme = "README.md"
keywords = ["emrtd", "icao9303", "passport", "mrz", "nfc"]
categories = ["cryptography", "parser-implementations"]

[lib]
# `lib` (rlib) keeps the crate usable as a normal Rust dependency; `cdylib` is the
# Android `.so` that cargo-ndk builds in the release workflow. iOS builds the static
# archive on demand with `cargo rustc --crate-type staticlib`, so it is not listed
# here. NB: cargo builds every listed crate-type on a normal `cargo build -p dmrtd`
# too — for this pure-Rust crate the extra cdylib link is cheap, but it is not free.
crate-type = ["lib", "cdylib"]

[dependencies]
# encoding / ASN.1 / time
asn1.workspace = true
base64.workspace = true
hex.workspace = true
chrono.workspace = true
once_cell.workspace = true
log.workspace = true
thiserror.workspace = true

# RustCrypto: block ciphers + MAC + hashes + traits
aes.workspace = true
des.workspace = true
cmac.workspace = true
sha1.workspace = true
sha2.workspace = true
digest.workspace = true
cipher.workspace = true
cbc.workspace = true
subtle.workspace = true
zeroize.workspace = true

# big integers + elliptic curves (PACE ECDH-GM, P-256)
num-bigint.workspace = true
num-traits.workspace = true
rand.workspace = true
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
p224 = { workspace = true }
bp256 = { workspace = true }
bp384 = { workspace = true }
elliptic-curve = { workspace = true }
